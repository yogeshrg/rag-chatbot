version: "3.8"

services:
  # Ollama LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: rag-chatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # RAG Chatbot API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-chatbot-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=llama3.1:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - LOG_LEVEL=INFO
      - VECTOR_STORE_PATH=/app/data/vector_store
      - DATA_DIR=/app/data/documents
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Streamlit UI
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-chatbot-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000/api/v1
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model puller (runs once to download models)
  model-puller:
    image: ollama/ollama:latest
    container_name: rag-chatbot-model-puller
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10 && \
        ollama pull llama3.1:8b && \
        ollama pull nomic-embed-text && \
        echo "Models pulled successfully"
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: